<!doctype html>
<html lang="ja-JP">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        height: 100%;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }

      .slide {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: start;
        background-color: #faf5e4;
      }

      img {
        display: block;
        max-height: 100vh;
        max-width: 100vw;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.07),
          0 4px 12px rgba(0, 0, 0, 0.1),
          2px 20px 48px rgba(0, 0, 0, 0.14),
          4px 40px 96px rgba(0, 0, 0, 0.09);
        width: auto;
        height: auto;
      }

      .jp {
        writing-mode: vertical-rl;
        font-family: "Noto Sans JP", sans-serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-style: normal;
        font-size: 4rem;
        padding: 3rem;
      }
      .jp p {
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <h1 class="jp">
        <p>
          <ruby>皆<rt>みな</rt></ruby
          >さん、<ruby>去年<rt>きょねん</rt></ruby
          >の<br />ビッグニュースは<br />何でしたか。
        </p>
      </h1>
    </div>
    <div class="slide">
      <img src="slide-1.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-2.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-3.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-4.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-5.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-6.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-7.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-8.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-9.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-10.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-11.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-12.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-13.png" alt="" />
    </div>
    <div class="slide">
      <img src="slide-14.png" alt="" />
    </div>
    <div class="slide">
      <h1 class="jp">
        <p>えっと…</p>
        <p>ここでChatGPTの<br />リミットです。</p>
      </h1>
    </div>
    <div class="slide">
      <h1 class="jp">
        <p>
          <ruby>皆<rt>みな</rt></ruby
          >さん、<ruby>来年<rt>らいねん</rt></ruby
          >の<br />ビッグニュースは<br />何だと思いますか。
        </p>
      </h1>
    </div>
    <div class="slide">
      <h1 class="jp">
        <p>
          じゃあね〜
        </p>
      </h1>
    </div>

    <script>
      let currentSlide = 0;
      const slides = document.querySelectorAll(".slide");
      const totalSlides = slides.length;

      function goToSlide(index) {
        if (index >= 0 && index < totalSlides) {
          currentSlide = index;
          slides[currentSlide].scrollIntoView({ behavior: "smooth" });
        }
      }

      // Keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowRight") {
          e.preventDefault();
          goToSlide(currentSlide + 1);
        } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          goToSlide(currentSlide - 1);
        }
      });

      // Track current slide on scroll
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              currentSlide = Array.from(slides).indexOf(entry.target);
            }
          });
        },
        { threshold: 0.5 },
      );

      slides.forEach((slide) => observer.observe(slide));
    </script>
  </body>
</html>
